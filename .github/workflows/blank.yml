name: Build ChaosClient 1.21.11

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          check-latest: true

      - name: Verify Java installation
        run: |
          java -version
          javac -version
          gradle --version

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon --stacktrace -x test -q

      - name: Check artifacts
        run: |
          echo "=== Checking build output ==="
          if [ -d build/libs ]; then
            ls -lh build/libs/
          else
            echo "ERROR: build/libs directory not found"
            find . -name "*.jar" -type f 2>/dev/null || echo "No JAR files found"
            exit 1
          fi

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chaosclient-jar-${{ github.run_number }}
          path: build/libs/chaosclient-1.0.0.jar
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/chaosclient-1.0.0.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "========================================="
          echo "ChaosClient Build Summary"
          echo "========================================="
          if [ $? -eq 0 ]; then
            echo "✓ Build Successful"
            echo "✓ JAR compiled: chaosclient-1.0.0.jar"
            echo "✓ Artifact uploaded"
          else
            echo "✗ Build Failed"
            echo "Check logs above for errors"
            exit 1
          fi
